<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 환율 계산기</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--tx:#2b2d31;--sub:#7a7f87;--line:#e4e6ea;--ch:#3a3d42;--chtx:#fff;--soft:#eceef1;--danger:#b23b3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#242629;--tx:#ececee;--sub:#9a9fa7;--line:#33363a;--ch:#e4e6ea;--chtx:#1d1e20;--soft:#2f3235;--danger:#e07a7a}}
:root[data-theme="dark"]{--bg:#17181a;--card:#242629;--tx:#ececee;--sub:#9a9fa7;--line:#33363a;--ch:#e4e6ea;--chtx:#1d1e20;--soft:#2f3235;--danger:#e07a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
#app{max-width:480px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:19px;margin:6px 2px 12px;display:flex;justify-content:space-between;align-items:center}
h1 small{font-size:11px;font-weight:500;color:var(--sub);background:var(--soft);padding:3px 9px;border-radius:99px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{font-size:15px;margin:0 0 10px}
input[type=text],input[type=number],input[type=date],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
input:focus,textarea:focus{outline:2px solid var(--ch);outline-offset:-1px}
textarea{min-height:70px;font-size:12px}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:flex;background:var(--soft);border-radius:99px;padding:3px;margin-bottom:12px}
.tabs a{flex:1;text-align:center;padding:9px;border-radius:99px;color:var(--sub);text-decoration:none;font-weight:600}
.tabs a.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on,.btn.pri{background:var(--ch);color:var(--chtx);border-color:var(--ch)}
.btn.pri{font-weight:700;padding:13px 16px}
.btn.full{width:100%}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.dg{color:var(--danger);border-color:var(--danger)}
.note{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.lbl{font-size:12px;color:var(--sub)}
.chk{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--ch)}
.sub{background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:8px}
.fold{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.fold.on{background:var(--soft);border-color:var(--line);font-weight:700}
.fold span.n{margin-left:auto;font-size:12px;color:var(--sub)}
.rec{padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.rec:first-child{border-top:0}
.rec .t{display:flex;justify-content:space-between;font-weight:600}
.rec .m{font-size:13px;color:var(--sub);margin-top:3px;display:flex;justify-content:space-between}
.warn{background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px}
details summary{cursor:pointer;color:var(--sub);font-size:13px;padding:8px 0 2px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ch);color:var(--chtx);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">불러오는 중…</div>
<div id="toast"></div>
<script>
const C=[['usd','달러',1],['jpy','엔화',100],['cny','위안화',1],['vnd','베트남 동',100],['twd','대만 달러',1],['thb','바트',1]];
const DR={usd:1400,jpy:950,cny:195,vnd:5.4,twd:45,thb:43}; // 참고용 예시값 — 직접 수정하세요
const today=()=>new Date().toLocaleDateString('sv');
const uid8=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
const num=n=>String(+(+n).toFixed(2));
const uc=c=>String(c).toUpperCase();
const $=id=>document.getElementById(id);
let S={folders:[],records:[],rates:{...DR},fid:null,basis:'all'};
let F={cur:'usd',amt:'',memo:'',date:today(),rec:false,grp:false,n:2,edit:null};
let U={dlg:null,filter:'',dbg:'',msg:''};
let mode='local',dref=null,q=Promise.resolve();

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

async function init(){
  try{
    if(window.claude&&claude.use){
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(db&&user){const id=await user.id();if(id){dref=db.doc('data/users/'+id+'/state');mode='cloud'}}
    }
  }catch(e){mode='local'}
  let raw=null;
  if(mode==='cloud'){
    try{const s=await dref.get();if(s.exists)raw=s.data().json}catch(e){mode='local'}
  }
  if(mode==='local'){try{raw=localStorage.getItem('travelfx.v1')}catch(e){}}
  if(raw){try{const o=JSON.parse(raw);S={...S,...o,rates:{...DR,...(o.rates||{})}}}catch(e){}}
  S.folders.forEach(f=>{if(!f.rates){f.rates={...DR,...S.rates};f.rinfo='이전 환율'}});
  let fresh=false;
  if(!S.folders.length){const f=mkFolder('첫 여행','usd');S.folders.push(f);S.fid=f.id;fresh=true}
  if(!S.folders.find(f=>f.id===S.fid))S.fid=S.folders[0].id;
  F.cur=curFolder().cur||'usd';
  window.addEventListener('hashchange',render);
  render();
  if(fresh)loadRates(curFolder());
}
function save(){
  const data=JSON.stringify(S);
  if(mode==='cloud'){q=q.then(()=>dref.set({json:data})).catch(()=>toast('저장에 실패했어요'))}
  else{try{localStorage.setItem('travelfx.v1',data)}catch(e){}}
}
const curFolder=()=>S.folders.find(f=>f.id===S.fid);
const unit=c=>C.find(x=>x[0]===c)[2];
const conv=(amt,c)=>(+amt||0)*(+R()[c]||0)/unit(c);
const route=()=>location.hash==='#/log'?'log':'calc';

/* ---------- 환율 자동 불러오기 ---------- */
const R=()=>curFolder().rates;
const mkFolder=(name,cur)=>({id:uid8(),name,cur,rates:{...DR},rinfo:'예시값'});
async function fetchRates(){
  const tj=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}};
  let m=null;
  try{const j=await tj('https://open.er-api.com/v6/latest/USD');if(j.result==='success'){m={};for(const k in j.rates)m[k.toLowerCase()]=j.rates[k]}}catch(e){}
  if(!m||!m.krw){try{const j=await tj('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');m=j.usd}catch(e){}}
  if(!m||!m.krw)return null;
  const o={};
  for(const [c,,u] of C){const v=c==='usd'?1:m[c];if(!(v>0))return null;o[c]=+(m.krw/v*u).toFixed(3)}
  return o;
}
async function loadRates(f,manual){
  const prev=f.rinfo;f.rinfo='환율 불러오는 중…';if(f.id===S.fid)render();
  let o=null;try{o=await fetchRates()}catch(e){}
  if(o){f.rates=o;f.rinfo='자동 · '+today()+' 기준';if(manual)toast('최신 환율로 채웠어요')}
  else{f.rinfo=manual?prev:'예시값 · 자동 환율을 못 가져왔어요';toast('환율을 못 가져왔어요. 인터넷 연결을 확인하세요')}
  save();if(f.id===S.fid)render();
}

/* ---------- 폴더 ---------- */
function folderCard(){
  const cf=curFolder();
  let h='<div class="card"><h2>📁 여행 폴더</h2>';
  h+=S.folders.map(f=>`<div class="fold ${f.id===S.fid?'on':''}" onclick="pickFolder('${f.id}')"><span>${f.id===S.fid?'📂':'📁'}</span>${esc(f.name)}<span class="n">${S.records.filter(r=>r.fid===f.id).length}건</span></div>`).join('');
  const d=U.dlg;
  if(d&&(d.t==='new'||d.t==='ren')){
    h+=`<div class="sub"><input type="text" id="fname" maxlength="30" placeholder="폴더 이름" value="${d.t==='ren'?esc(cf.name):''}"><div class="row" style="margin-top:8px"><button class="btn pri sm" onclick="okName()">${d.t==='new'?'만들기':'저장'}</button><button class="btn sm" onclick="U.dlg=null;render()">취소</button></div></div>`;
  }else if(d&&d.t==='del'){
    const n=S.records.filter(r=>r.fid===S.fid).length;
    h+=`<div class="warn">「${esc(cf.name)}」 폴더와 안에 있는 기록 ${n}건이 함께 삭제됩니다. 되돌릴 수 없어요. 삭제할까요?<div class="row" style="margin-top:8px"><button class="btn dg sm" onclick="okDel()">삭제</button><button class="btn sm" onclick="U.dlg=null;render()">취소</button></div></div>`;
  }else{
    h+=`<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sm" onclick="U.dlg={t:'new'};render()">＋ 새 폴더</button><button class="btn sm" onclick="U.dlg={t:'ren'};render()">이름 바꾸기</button><button class="btn sm dg" onclick="U.dlg={t:'del'};render()">삭제</button></div>`;
  }
  h+=`<details><summary>백업 / 가져오기</summary><div class="note">전체 폴더·기록을 JSON으로 내보내거나 가져옵니다. 가져올 때 이름이 겹치면 “(가져옴)”이 붙고 기존 데이터는 덮어쓰지 않아요.</div>
  <div class="row" style="margin:8px 0"><button class="btn sm" onclick="doExport()">내보내기</button><button class="btn sm" onclick="doImport()">가져오기</button><label class="btn sm" style="margin:0">파일 선택<input type="file" accept=".json,application/json" style="display:none" onchange="pickFile(this)"></label></div>
  <textarea id="bk" placeholder="여기에 JSON이 표시되거나, 붙여넣어 가져올 수 있어요">${esc(U.dbg)}</textarea><div class="note">${esc(U.msg)}</div></details></div>`;
  return h;
}
function pickFolder(id){S.fid=id;U.dlg=null;F.cur=curFolder().cur||'usd';F.edit=null;F.amt='';save();render()}
function okName(){
  const v=$('fname').value.trim();if(!v)return toast('이름을 입력하세요');
  let nf=null;
  if(U.dlg.t==='new'){nf=mkFolder(v,F.cur);S.folders.push(nf);S.fid=nf.id}
  else curFolder().name=v;
  U.dlg=null;F.edit=null;save();render();if(nf)loadRates(nf);
}
function okDel(){
  S.records=S.records.filter(r=>r.fid!==S.fid);
  S.folders=S.folders.filter(f=>f.id!==S.fid);
  let nf=null;if(!S.folders.length){nf=mkFolder('첫 여행','usd');S.folders.push(nf)}
  S.fid=S.folders[0].id;F.cur=curFolder().cur||'usd';F.edit=null;U.dlg=null;save();render();if(nf)loadRates(nf);
}
/* 백업 */
async function doExport(){
  const j=JSON.stringify({v:1,folders:S.folders,records:S.records},null,1);
  U.dbg=j;$('bk').value=j;
  const name='travel-fx-backup-'+today()+'.json';
  try{
    if(window.claude&&claude.use){
      const dl=await claude.use('downloads');
      if(dl){await dl.save({filename:name,data:j});U.msg='내보냈어요.';render();return}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
    U.msg='내보냈어요.';
  }catch(e){U.msg='저장은 취소됐어요. 아래 JSON을 복사해 보관하세요.'}
  render();
}
function pickFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{U.dbg=String(r.result);$('bk').value=U.dbg;U.msg='파일을 읽었어요. “가져오기”를 누르세요.';render()};r.readAsText(f)}
function doImport(){
  let o;try{o=JSON.parse($('bk').value)}catch(e){U.msg='JSON 형식이 올바르지 않아요.';return render()}
  if(!o||!Array.isArray(o.folders)||!Array.isArray(o.records)){U.msg='백업 파일 형식이 아니에요.';return render()}
  const names=new Set(S.folders.map(f=>f.name)),map={};let nf=0,nr=0;
  o.folders.forEach(f=>{
    let nm=String(f.name||'폴더');while(names.has(nm))nm+='(가져옴)';
    names.add(nm);const id=uid8();map[f.id]=id;S.folders.push({id,name:nm,cur:f.cur||'usd',rates:f.rates||{...DR},rinfo:f.rinfo||'가져옴'});nf++;
  });
  o.records.forEach(r=>{if(map[r.fid]){S.records.push({...r,id:uid8(),fid:map[r.fid]});nr++}});
  U.msg=`폴더 ${nf}개, 기록 ${nr}건을 가져왔어요.`;U.dbg='';save();render();
}

/* ---------- 계산기 ---------- */
function calcView(){
  const c=F.cur,u=unit(c),edit=F.edit;
  let h=folderCard()+'<div class="card"><h2>환율 계산기</h2><div class="chips">'+
  C.map(x=>`<button class="chip ${x[0]===c?'on':''}" onclick="setCur('${x[0]}')">${x[1]}(${uc(x[0])})</button>`).join('')+'</div>';
  h+=`<label class="f">환율 (${u>1?u+' '+uc(c)+' = ':'1 '+uc(c)+' = '}₩)</label><input type="number" inputmode="decimal" id="rate" value="${R()[c]}" oninput="setRate(this.value)">
  <div class="note">네이버 환율 기준 참고값으로 채워둔 예시예요. 실제 결제엔 은행 고시환율(매매기준율·카드사 환율)을 확인하고 직접 수정하세요.</div>
  <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sm" onclick="loadRates(curFolder(),true)">환율 다시 불러오기</button><span class="note" style="margin:0">${esc(curFolder().rinfo||'')}</span></div>
  <label class="f">금액 (${uc(c)}${u>1?', '+u+' 단위 아님 · 실제 금액':''})</label><input type="number" inputmode="decimal" id="amt" placeholder="0" value="${esc(F.amt)}" oninput="F.amt=this.value;upd()">
  <div style="margin-top:14px"><div class="lbl">원화 환산</div><div class="big" id="big"></div></div>
  <label class="chk"><input type="checkbox" ${F.rec?'checked':''} onchange="F.rec=this.checked;render()">지출로 기록하기</label>`;
  if(F.rec){
    h+=`<div class="sub"><label class="f" style="margin-top:0">사용처 / 메모</label><input type="text" maxlength="60" value="${esc(F.memo)}" oninput="F.memo=this.value" placeholder="예: 라멘, 택시">
    <label class="f">날짜</label><input type="date" value="${F.date}" onchange="F.date=this.value||today()">
    <label class="chk"><input type="checkbox" ${F.grp?'checked':''} onchange="F.grp=this.checked;render()">단체 결제 (1/n)</label>`;
    if(F.grp)h+=`<label class="f" style="margin-top:0">인원수</label><input type="number" min="1" inputmode="numeric" value="${F.n}" oninput="F.n=this.value;upd()"><div style="margin-top:8px"><div class="lbl">인당 금액</div><div style="font-size:22px;font-weight:700" id="per"></div></div>`;
    h+='</div>';
  }
  h+='<div style="margin-top:14px">';
  if(F.rec){
    if(edit)h+=`<button class="btn pri full" onclick="saveRec()">수정 완료</button><div class="row" style="margin-top:8px"><button class="btn full" onclick="cancelEdit()">취소</button><button class="btn full dg" onclick="U.dlg={t:'rdel'};render()">삭제</button></div>`;
    else h+='<button class="btn pri full" onclick="saveRec()">기록 저장</button>';
    if(U.dlg&&U.dlg.t==='rdel')h+=`<div class="warn">이 기록을 삭제할까요?<div class="row" style="margin-top:8px"><button class="btn dg sm" onclick="delRec()">삭제</button><button class="btn sm" onclick="U.dlg=null;render()">취소</button></div></div>`;
  }
  h+='</div></div>';
  return h;
}
function upd(){
  const t=conv(F.amt,F.cur);$('big').textContent=won(t);
  if($('per')){const n=Math.max(1,parseInt(F.n)||1);$('per').textContent=won(t/n)+'  ('+num((+F.amt||0)/n)+' '+uc(F.cur)+')'}
}
function setRate(v){R()[F.cur]=v===''?0:+v;save();upd()}
function setCur(c){F.cur=c;curFolder().cur=c;save();render()}
function saveRec(){
  const a=+F.amt;if(!(a>0))return toast('금액을 입력하세요');
  const n=F.grp?Math.max(1,parseInt(F.n)||1):1;
  const base={fid:S.fid,cur:F.cur,amt:a,rate:+R()[F.cur]||0,krw:conv(a,F.cur),memo:F.memo.trim(),date:F.date||today(),grp:F.grp,n};
  if(F.edit){const r=S.records.find(x=>x.id===F.edit);if(r)Object.assign(r,base);toast('수정했어요')}
  else{S.records.push({id:uid8(),ts:Date.now(),...base});toast('저장했어요')}
  const was=F.edit;F.edit=null;F.amt='';F.memo='';curFolder().cur=F.cur;U.dlg=null;save();
  if(was)location.hash='#/log';else render();
}
function openEdit(id){
  const r=S.records.find(x=>x.id===id);if(!r)return;
  F={cur:r.cur,amt:String(r.amt),memo:r.memo,date:r.date,rec:true,grp:r.grp,n:r.n,edit:id};
  R()[r.cur]=r.rate||R()[r.cur];U.dlg=null;
  if(location.hash==='#/calc')render();else location.hash='#/calc';
}
function cancelEdit(){F={...F,edit:null,amt:'',memo:''};U.dlg=null;location.hash='#/log'}
function delRec(){S.records=S.records.filter(r=>r.id!==F.edit);F={...F,edit:null,amt:'',memo:''};U.dlg=null;save();toast('삭제했어요');location.hash='#/log'}

/* ---------- 기록 보기 ---------- */
function logView(){
  const share=S.basis==='share';
  let rs=S.records.filter(r=>r.fid===S.fid);
  if(U.filter)rs=rs.filter(r=>r.date===U.filter);
  rs.sort((a,b)=>(b.date.localeCompare(a.date))||(b.ts-a.ts));
  let total=0;const by={};
  rs.forEach(r=>{const k=share?1/r.n:1;total+=r.krw*k;by[r.cur]=(by[r.cur]||0)+r.amt*k});
  let h=folderCard()+`<div class="card"><h2>${esc(curFolder().name)} ${U.filter?'· '+U.filter:''}</h2>
  <div class="chips"><button class="chip ${!share?'on':''}" onclick="setBasis('all')">전체금액</button><button class="chip ${share?'on':''}" onclick="setBasis('share')">내 몫만(1/n)</button></div>
  <div style="margin-top:12px"><div class="lbl">${share?'내 몫 합계':'전체 합계'}</div><div class="big">${won(total)}</div>
  <div class="note">${Object.keys(by).length?Object.entries(by).map(([c,v])=>uc(c)+' '+num(v)).join(', '):'기록이 없어요'}</div></div>
  <label class="f">날짜별 보기</label><div class="row"><input type="date" value="${U.filter}" onchange="U.filter=this.value;render()"><button class="btn sm" style="white-space:nowrap" onclick="U.filter='';render()">전체 보기</button></div></div>
  <div class="card"><h2>지출 내역 (${rs.length})</h2>`;
  if(!rs.length)h+='<div class="note">해당하는 기록이 없어요. 계산기에서 “지출로 기록하기”를 켜고 저장해 보세요.</div>';
  h+=rs.map(r=>`<div class="rec" onclick="openEdit('${r.id}')"><div class="t"><span>${esc(r.memo||'(메모 없음)')}</span><span>${r.date}</span></div>
  <div class="m"><span>전체 금액</span><span>${won(r.krw)} · ${num(r.amt)} ${uc(r.cur)}</span></div>
  <div class="m"><span>내 몫${r.grp?' (1/'+r.n+')':''}</span><span>${won(r.krw/r.n)} · ${num(r.amt/r.n)} ${uc(r.cur)}</span></div></div>`).join('');
  return h+'</div>';
}
function setBasis(b){S.basis=b;save();render()}

/* ---------- 렌더 ---------- */
function render(){
  const r=route();
  $('app').innerHTML=`<h1>✈️ 여행 환율 계산기<small>${mode==='cloud'?'내 계정에 비공개 저장':'이 브라우저에 저장'}</small></h1>
  <div class="tabs"><a href="#/calc" class="${r==='calc'?'on':''}">계산기</a><a href="#/log" class="${r==='log'?'on':''}">기록 보기</a></div>`+(r==='calc'?calcView():logView());
  if(r==='calc')upd();
}
init();
</script>
</body>
</html>
